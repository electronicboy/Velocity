# Validates Velocity's protocol registries against Mojang's own data generator.
#
# Kept out of the normal build: it downloads every supported vanilla server jar and runs the data
# generator over each, which takes minutes and needs network access. Nothing it extracts is
# committed — it is re-pulled on every run.
name: Protocol conformance

on:
  schedule:
    # Weekly: the long-running regression watch over everything Velocity claims to support.
    - cron: '0 6 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    # Pull requests only opt in via the label, so this stays off the critical path for everything
    # that is not a version bump.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'minecraft update')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Run conformance checks
        # Versions come from ProtocolVersion.SUPPORTED_VERSIONS, so a `minecraft update` branch
        # automatically has its new snapshot checked alongside the releases.
        # --build-cache turns an unchanged upstream into a cache hit rather than a rerun; the
        # extraction is keyed on the sha1s Mojang publishes, so a hit means nothing has moved.
        # Server jars are deliberately not cached here: at ~1GB a run they would churn the repo's
        # 10GB Actions cache for a saving that only applies when the extraction reruns anyway.
        run: ./gradlew :velocity-protocol-conformance:conformanceTest --build-cache
      - name: Upload extracted registries
        # Kept on failure so the divergence can be inspected without re-running the extraction.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-data
          path: protocol-conformance/build/vanilla-data
