# Expected results for the vanilla conformance suite (see
# docs/superpowers/specs/2026-10-25-vanilla-conformance-design.md, section 7).
#
# [[expect]] marks a failure as known. It matches failures whose signature starts with
# `signature`, in cells selected by `proxy`, `scenario` and `versions` (all default to "*").
# A matching failure is reported but does not fail the run; an expectation that stops matching
# fails the run as an unexpected pass, so a fix has to move its entry out of this file.
#
# [[unreachable]] records a packet the harness cannot provoke from a vanilla server and a
# scripted client, so the coverage report only lists genuine gaps.
#
# Version ranges: "*", "1.20.4", ">=1.20.2", "<1.13", "1.8..1.12.2", or a comma-separated list.

[[expect]]
proxy = "velocity"
# Only operators see the commands that use these arguments, and only play/exercise ops the player.
scenario = "play/exercise"
versions = ">=1.18.2"
signature = "MISMATCH S->C PLAY minecraft:commands"
detail = "sent minecraft:resource_or_tag delivered minecraft:resource"
reason = """\
  Velocity re-encodes every minecraft:resource_or_tag argument as minecraft:resource. Both are \
  registered against RegistryKeyArgument.class in ArgumentPropertyRegistry, so the class-to-id \
  map keeps whichever is registered last. Clients then reject tag syntax (#minecraft:...) in \
  /locate, /fillbiome and /execute if biome before the command is ever sent. On 1.18.2, where \
  parsers are named on the wire, the substituted minecraft:resource does not exist yet."""

[[expect]]
proxy = "velocity"
scenario = "play/exercise"
signature = "REORDERED C->S PLAY minecraft:chat"
flaky = true
reason = """\
  Velocity forwards chat messages and commands only once PlayerChatEvent / CommandExecuteEvent \
  have completed asynchronously, so serverbound packets the client sent afterwards can reach the \
  backend first. Timing-dependent, hence flaky."""

[[expect]]
proxy = "velocity"
scenario = "play/exercise"
versions = "1.19..1.19.2"
signature = "MISMATCH C->S PLAY minecraft:chat"
reason = """\
  Velocity re-stamps unsigned 1.19-1.19.2 chat with Instant.now() when it encodes the packet \
  (KeyedPlayerChatPacket#encode), after the asynchronous PlayerChatEvent, instead of forwarding \
  the client's timestamp."""

[[expect]]
proxy = "velocity"
scenario = "play/exercise"
versions = "1.19..1.19.2"
signature = "CHECK client.disconnected"
detail = "out_of_order_chat"
flaky = true
reason = """\
  Consequence of the re-stamp above: a command the client sent after the chat keeps its original, \
  earlier timestamp, so vanilla sees time run backwards and kicks the player with \
  multiplayer.disconnect.out_of_order_chat. Timing-dependent."""

# --- Server transitions (switch/*) ------------------------------------------------------------

[[expect]]
proxy = "velocity"
scenario = "switch/*"
versions = ">=1.20.2"
signature = "CHECK probe.dropped PLAY_ENTERED"
issue = 1766
reason = """\
  Plugin messages the client sends between finishing configuration and the backend's join game \
  are dropped: ClientPlaySessionHandler#handle(PluginMessagePacket) only falls back to the \
  connection in flight for the legacy Forge handshake channel, and getConnectedServer() is null \
  until the join game has been processed."""

[[expect]]
proxy = "velocity"
scenario = "switch/*"
versions = ">=1.20.2"
signature = "CHECK probe.dropped START_CONFIGURATION"
reason = """\
  Plugin messages the client sends between the proxy starting a switch and the client \
  acknowledging configuration are dropped: ClientPlaySessionHandler#doSwitch clears the \
  connected server and disconnects the old backend before sending start_configuration, so the \
  old server can no longer receive them and the new one is not wired up yet."""

[[expect]]
proxy = "velocity"
scenario = "switch/*"
versions = ">=1.20.2"
signature = "CHECK probe.dropped CONFIGURATION_ENTERED"
flaky = true
reason = """\
  A plugin message sent right after the login acknowledgement, before the proxy has a backend \
  connection in flight, is silently dropped by ClientConfigSessionHandler#handle(PluginMessagePacket). \
  Timing-dependent: once the connection exists it is forwarded (or crashes, see below)."""

[[expect]]
proxy = "velocity"
scenario = "switch/*"
versions = ">=1.20.2"
signature = "CHECK proxy.log"
detail = "Not connected to server"
flaky = true
reason = """\
  Same window, worse outcome: when the connection in flight exists but is not connected yet, \
  ClientConfigSessionHandler#handle(PluginMessagePacket) calls ensureConnected(), which throws \
  IllegalStateException and disconnects the player with "An internal error occurred in your \
  connection". Clients whose mods send payloads as soon as configuration starts hit this."""

[[expect]]
proxy = "velocity"
scenario = "switch/*"
versions = ">=1.20.2"
signature = "CHECK client.play"
detail = "internal error occurred"
flaky = true
reason = "The disconnect caused by the ensureConnected() exception above."

[[expect]]
proxy = "velocity"
scenario = "switch/rapid"
versions = "<1.20.2"
signature = "CHECK switch.ignored"
flaky = true
reason = """\
  Chat and commands the client sends right after a switch's join game are silently dropped: \
  ClientPlaySessionHandler's chat and command handlers return early while getCurrentServer() is \
  empty, and the connected server is only set once ServerConnectedEvent has completed \
  asynchronously. The rapid scenario's second /server is lost this way. Timing-dependent."""
